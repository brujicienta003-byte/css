<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FairyTailRPG Video Generator</title>
<style>
:root{--ink:#171717;--muted:#746f6a;--paper:#fff;--line:#ddd9d5;--accent:#706c64;--page:#111218;--panel:#191a22}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:var(--page);color:#f7f4ef}.generator{min-height:100vh;padding:36px 20px 60px;background:radial-gradient(circle at 12% 0,#242637 0,transparent 34%),radial-gradient(circle at 100% 100%,#202234 0,transparent 38%),var(--page)}.generator-shell{width:min(1080px,100%);margin:auto}.eyebrow{margin:0 0 10px;color:#aaa4a0;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}.generator h1{margin:0;font-family:Georgia,serif;font-size:clamp(34px,6vw,66px);font-weight:400;letter-spacing:-.04em}.intro{max-width:650px;margin:12px 0 30px;color:#b9b4b0;font-size:14px;line-height:1.7}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}.form-card,.preview-card{border:1px solid #ffffff12;border-radius:18px;background:#191a22dd;box-shadow:0 22px 60px #0005}.form-card{padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{color:#d7d2cc;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.field input{width:100%;height:42px;padding:0 12px;border:1px solid #ffffff19;border-radius:9px;outline:0;background:#101116;color:#fff;font:13px Arial}.field input:focus{border-color:#a29b90;box-shadow:0 0 0 3px #a29b901c}.checkline{display:flex;align-items:center;gap:9px;margin-top:2px;color:#c8c3be;font-size:12px}.checkline input{width:15px;height:15px;accent-color:#8e887e}.actions{display:flex;gap:10px;margin-top:22px}.button{height:42px;padding:0 18px;border:0;border-radius:10px;background:#f4f1ec;color:#171717;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.button.secondary{border:1px solid #ffffff18;background:#24252e;color:#fff}.output{margin-top:22px}.output textarea{width:100%;min-height:112px;padding:14px;border:1px solid #ffffff17;border-radius:10px;resize:vertical;background:#0e0f14;color:#d8d2cb;font:11px/1.55 Consolas,monospace}.status{min-height:18px;margin:8px 0 0;color:#aaa49d;font-size:11px}.preview-card{position:sticky;top:22px;padding:17px}.preview-label{margin:0 0 13px;color:#aaa49d;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.preview-frame{display:block;width:290px;height:430px;margin:auto;border:0;border-radius:8px;background:#fff}.player-page{display:grid;min-height:100vh;place-items:center;background:transparent}.player{width:290px;padding:12px 10px 14px;border-radius:5px;background:var(--paper);box-shadow:0 5px 22px #0002;color:var(--ink);text-align:center}.media{position:relative;width:270px;height:270px;overflow:hidden;background:#0b0b0b}.media-cover{position:absolute;inset:0;z-index:3;width:100%;height:100%;padding:0;border:0;background:#111;cursor:pointer}.media-cover img{display:block;width:100%;height:100%;object-fit:cover}.media-cover.gray img,.media.gray iframe{filter:grayscale(1)}.media-cover::after{content:"";position:absolute;top:50%;left:50%;width:0;height:0;margin-left:5px;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:19px solid #fff;transform:translate(-50%,-50%);z-index:2}.media-cover::before{content:"";position:absolute;top:50%;left:50%;width:64px;height:64px;border-radius:50%;background:#000c;box-shadow:0 4px 15px #0004;transform:translate(-50%,-50%);z-index:1}.media-cover.loading::after{width:18px;height:18px;margin:0;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}.media-cover.hidden{display:none}.media iframe{position:absolute;top:50%;left:50%;width:690px;height:388px;border:0;transform:translate(-50%,-50%)}.track-info{padding:9px 0 11px}.track-info b{display:block;font-size:14px;line-height:18px}.track-info span{display:block;margin-top:3px;color:#555;font-size:9px;text-transform:uppercase}.player-controls{display:flex;align-items:center;justify-content:space-around;padding:0 16px 10px}.control{display:grid;width:22px;height:28px;padding:0;border:0;background:transparent;color:#222;font:13px Arial;place-items:center;cursor:pointer;user-select:none}.control:first-child,.control:last-child{color:#888}.control.active{color:var(--accent)}.control-main{display:flex;align-items:center;justify-content:center;width:43px;height:43px;border-radius:50%;background:var(--accent);box-shadow:0 3px 9px #0003;color:#fff;font-size:0}.control-main::before,.control-main::after{content:"";display:block;width:4px;height:15px;border-radius:2px;background:#fff}.control-main::after{margin-left:4px}.control-main.paused::before{width:0;height:0;margin-left:3px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:12px solid #fff;border-radius:0;background:transparent}.control-main.paused::after{display:none}.progress{position:relative;height:14px;margin-bottom:0}.progress input{position:absolute;inset:0;width:100%;height:14px;margin:0;opacity:0;cursor:pointer}.progress-track{position:absolute;top:5px;left:0;width:100%;height:3px;overflow:hidden;border-radius:5px;background:#ddd;pointer-events:none}.progress-track span{display:block;width:0;height:100%;background:var(--accent)}.times{display:flex;justify-content:space-between;color:#333;font:9px monospace}.empty-cover{display:grid;width:100%;height:100%;place-items:center;background:linear-gradient(145deg,#312f32,#151518);color:#aaa;font:11px Arial}@keyframes spin{to{transform:translate(-50%,-50%) rotate(1turn)}}@media(max-width:820px){.workspace{grid-template-columns:1fr}.preview-card{position:static}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:380px){.generator{padding-inline:12px}.form-card{padding:17px}.preview-card{padding:10px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
const app=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const escapeHtml=(value)=>String(value??'').replace(/[&<>'"]/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const extractVideoId=(value)=>{const raw=String(value||'').trim();if(/^[\w-]{11}$/.test(raw))return raw;try{const url=new URL(raw);if(url.hostname.includes('youtu.be'))return url.pathname.split('/').filter(Boolean)[0]||'';if(url.pathname.includes('/embed/'))return url.pathname.split('/embed/')[1].split('/')[0]||'';if(url.pathname.includes('/shorts/'))return url.pathname.split('/shorts/')[1].split('/')[0]||'';return url.searchParams.get('v')||''}catch{return ''}};
const cleanColor=(value)=>/^#[0-9a-f]{6}$/i.test(value||'')?value:'#706c64';
let youtubeApiPromise;
function loadYouTubeApi(){
if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);
if(youtubeApiPromise)return youtubeApiPromise;
youtubeApiPromise=new Promise((resolve,reject)=>{
window.onYouTubeIframeAPIReady=()=>resolve(window.YT);
const script=document.createElement('script');
script.src='https://www.youtube.com/iframe_api';
script.onerror=()=>reject(new Error('No se pudo cargar YouTube'));
document.head.appendChild(script);
});
return youtubeApiPromise;
}
function renderPlayer(){
const video=extractVideoId(qs.get('video'));
const cover=qs.get('cover')||'';
const title=qs.get('title')||'I Got Your Back';
const artist=qs.get('artist')||'ILLIT';
const gray=qs.get('gray')!=='0';
const accent=cleanColor(qs.get('accent'));
document.documentElement.style.setProperty('--accent',accent);
document.body.className='player-page';
app.innerHTML='<section class="player" aria-label="Reproductor de '+escapeHtml(title)+'"><div class="media'+(gray?' gray':'')+'"><div id="youtube-player"></div><button class="media-cover '+(gray?'gray':'')+'" type="button" aria-label="Reproducir video">'+(cover?'<img src="'+escapeHtml(cover)+'" alt="">':'<span class="empty-cover">Sin portada</span>')+'</button></div><div class="track-info"><b>'+escapeHtml(title)+'</b><span>'+escapeHtml(artist)+'</span></div><div class="player-controls"><button class="control control-mute" type="button" title="Silenciar" aria-label="Silenciar">↝</button><button class="control control-back" type="button" title="Retroceder 10 segundos" aria-label="Retroceder 10 segundos">◀</button><button class="control control-main paused" type="button" title="Reproducir" aria-label="Reproducir"></button><button class="control control-forward" type="button" title="Avanzar 10 segundos" aria-label="Avanzar 10 segundos">▶</button><button class="control control-loop" type="button" title="Repetir" aria-label="Repetir" aria-pressed="false">↜</button></div><div class="progress"><div class="progress-track"><span></span></div><input type="range" min="0" max="1000" value="0" step="1" aria-label="Progreso del video"></div><div class="times"><span class="time-current">00:00</span><span class="time-duration">00:00</span></div></section>';
const coverButton=app.querySelector('.media-cover');
const mainButton=app.querySelector('.control-main');
const muteButton=app.querySelector('.control-mute');
const backButton=app.querySelector('.control-back');
const forwardButton=app.querySelector('.control-forward');
const loopButton=app.querySelector('.control-loop');
const range=app.querySelector('.progress input');
const fill=app.querySelector('.progress-track span');
const currentLabel=app.querySelector('.time-current');
const durationLabel=app.querySelector('.time-duration');
let player;
let readyPromise;
let isReady=false;
let timer;
let seeking=false;
let loop=false;
const formatTime=(seconds)=>{const value=Math.max(0,Math.floor(Number(seconds)||0));return String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0')};
const setPlaying=(playing)=>{mainButton.classList.toggle('paused',!playing);mainButton.title=playing?'Pausar':'Reproducir';mainButton.setAttribute('aria-label',mainButton.title)};
const syncProgress=()=>{
if(!player||typeof player.getDuration!=='function')return;
const duration=player.getDuration()||0;
const current=player.getCurrentTime()||0;
if(!seeking){const progress=duration?current/duration*1000:0;range.value=String(progress);fill.style.width=progress/10+'%'}
currentLabel.textContent=formatTime(current);
durationLabel.textContent=formatTime(duration);
};
const startTimer=()=>{clearInterval(timer);syncProgress();timer=setInterval(syncProgress,250)};
const stopTimer=()=>{clearInterval(timer);syncProgress()};
function ensurePlayer(){
if(isReady){player.playVideo();return Promise.resolve(player)}
if(readyPromise)return readyPromise.then((readyPlayer)=>{readyPlayer.playVideo();return readyPlayer});
if(!video){const empty=coverButton.querySelector('.empty-cover');if(empty)empty.textContent='Falta el ID de YouTube';return Promise.reject(new Error('Falta el ID'))}
coverButton.classList.add('loading');
readyPromise=loadYouTubeApi().then(()=>new Promise((resolve,reject)=>{
player=new YT.Player('youtube-player',{
width:690,
height:388,
videoId:video,
playerVars:{autoplay:1,controls:0,playsinline:1,rel:0,iv_load_policy:3,fs:0},
events:{
onReady:(event)=>{isReady=true;coverButton.classList.remove('loading');coverButton.classList.add('hidden');event.target.playVideo();syncProgress();resolve(event.target)},
onStateChange:(event)=>{
if(event.data===YT.PlayerState.PLAYING){setPlaying(true);startTimer()}
if(event.data===YT.PlayerState.PAUSED||event.data===YT.PlayerState.CUED){setPlaying(false);stopTimer()}
if(event.data===YT.PlayerState.ENDED){setPlaying(false);stopTimer();if(loop){event.target.seekTo(0,true);event.target.playVideo()}}
},
onError:()=>{coverButton.classList.remove('loading');coverButton.classList.remove('hidden');setPlaying(false);reject(new Error('YouTube no pudo reproducir este video'))}
}
});
})).catch((error)=>{coverButton.classList.remove('loading');const empty=coverButton.querySelector('.empty-cover');if(empty)empty.textContent='No se pudo cargar YouTube';throw error});
return readyPromise;
}
coverButton.addEventListener('click',()=>{ensurePlayer().catch(()=>{})});
mainButton.addEventListener('click',()=>{
if(!isReady){ensurePlayer().catch(()=>{});return}
if(player.getPlayerState()===YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo();
});
muteButton.addEventListener('click',()=>{
if(!isReady)return;
if(player.isMuted()){player.unMute();muteButton.classList.remove('active');muteButton.title='Silenciar'}else{player.mute();muteButton.classList.add('active');muteButton.title='Activar sonido'}
muteButton.setAttribute('aria-label',muteButton.title);
});
backButton.addEventListener('click',()=>{if(isReady)player.seekTo(Math.max(0,player.getCurrentTime()-10),true)});
forwardButton.addEventListener('click',()=>{if(isReady)player.seekTo(Math.min(player.getDuration(),player.getCurrentTime()+10),true)});
loopButton.addEventListener('click',()=>{loop=!loop;loopButton.classList.toggle('active',loop);loopButton.setAttribute('aria-pressed',String(loop))});
range.addEventListener('input',()=>{seeking=true;fill.style.width=Number(range.value)/10+'%';if(isReady){const duration=player.getDuration()||0;currentLabel.textContent=formatTime(duration*Number(range.value)/1000)}});
range.addEventListener('change',()=>{if(isReady){const duration=player.getDuration()||0;player.seekTo(duration*Number(range.value)/1000,true)}seeking=false;syncProgress()});
}
function renderGenerator(){
document.body.className='generator';
app.innerHTML='<div class="generator-shell"><p class="eyebrow">FairyTailRPG · herramienta privada</p><h1>Video post generator</h1><p class="intro">Armá una portada musical limpia para tus tablillas. No guarda archivos ni necesita base de datos: cada combinación genera una URL única lista para embeber.</p><div class="workspace"><section class="form-card"><div class="form-grid"><div class="field full"><label for="video">Video de YouTube</label><input id="video" placeholder="URL o ID del video"></div><div class="field full"><label for="cover">Portada custom</label><input id="cover" placeholder="https://..."></div><div class="field"><label for="title">Título</label><input id="title" value="I Got Your Back"></div><div class="field"><label for="artist">Artista</label><input id="artist" value="ILLIT"></div><div class="field"><label for="accent">Color de controles</label><input id="accent" type="color" value="#706c64"></div><label class="checkline"><input id="gray" type="checkbox" checked> Convertir portada a escala de grises</label></div><div class="actions"><button class="button" id="generate" type="button">Generar iframe</button><button class="button secondary" id="copy" type="button">Copiar código</button></div><div class="output"><textarea id="code" readonly aria-label="Código iframe generado"></textarea><p class="status" id="status"></p></div></section><aside class="preview-card"><p class="preview-label">Vista previa</p><iframe class="preview-frame" id="preview" title="Vista previa del reproductor"></iframe></aside></div></div>';
const $=(id)=>document.getElementById(id);
const fields=['video','cover','title','artist','accent','gray'];
function build(){
const video=extractVideoId($('video').value);
const base=new URL('fairytail-player.html',location.href);
base.searchParams.set('embed','1');
base.searchParams.set('video',video||$('video').value.trim());
base.searchParams.set('cover',$('cover').value.trim());
base.searchParams.set('title',$('title').value.trim());
base.searchParams.set('artist',$('artist').value.trim());
base.searchParams.set('accent',$('accent').value);
base.searchParams.set('gray',$('gray').checked?'1':'0');
const src=base.href;
const code='<iframe src="'+src.replace(/&/g,'&amp;')+'" width="290" height="430" frameborder="0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>';
$('code').value=code;
$('preview').src=src;
$('status').textContent=video?'Listo para pegar en el foro.':'Pegá un enlace válido de YouTube para completar el reproductor.';
return code;
}
$('generate').addEventListener('click',build);
$('copy').addEventListener('click',async()=>{const code=build();try{await navigator.clipboard.writeText(code);$('status').textContent='Código copiado.'}catch{$('code').select();document.execCommand('copy');$('status').textContent='Código copiado.'}});
fields.forEach((id)=>$(id).addEventListener(id==='gray'?'change':'input',build));
build();
}
if(qs.has('embed')||qs.has('video'))renderPlayer();else renderGenerator();
})();
</script>
</body>
</html>
